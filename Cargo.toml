[workspace]

resolver = "3" # 2024
members = ["crates/*", "examples/*"]
exclude = ["benches/axum", "benches/feather"]

[workspace.dependencies]
feather = { version = "~0.8", path = "./crates/feather", default-features = false }
feather-runtime = { version = "~0.6", path = "./crates/feather-runtime", default-features = false }
feather-macros = { version = "~0.2", path = "./crates/feather-macros" }
http = { version = "1.5", default-features = false, features = ["std"] }
httparse = { version = "1", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
bytes = { version = "1.12", default-features = false }
log = { version = "0.4.33", default-features = false }
serde_urlencoded = { version = "0.7.1", default-features = false }
thiserror = { version = "2.0.19", default-features = false }
jsonwebtoken = { version = "9.3.1", default-features = false }
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
urlencoding = "2.1.3"
parking_lot = { version = "0.12.5" }
may = { version = "0.3.51", git = "https://github.com/BersisSe/may"}
itoa = "1.0.18"
time = { version = "0.3.54", default-features = false, features = ["formatting", "macros", "local-offset", "std"] }


[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true